grpc=WildFly Extension for gRPC
grpc.add=Add the gRPC subsystem
grpc.remove=Remove the gRPC subsystem
grpc.default-thread-pool=The default thread pool for gRPC async operations

# Thread pool resource
grpc.thread-pool=A thread pool executor with an unbounded queue for gRPC async operations.
grpc.thread-pool.add=Adds an unbounded thread pool for gRPC.
grpc.thread-pool.remove=Removes an unbounded thread pool for gRPC.
grpc.thread-pool.name=The name of the thread pool.

# TODO (jrp) why do we seem to need both?
grpc.thread-pool.active-count=The approximate number of threads that are actively executing tasks.
grpc.thread-pool.completed-task-count=The approximate total number of tasks that have completed execution.
grpc.thread-pool.current-thread-count=The current number of threads in the pool.
grpc.thread-pool.keepalive-time=Used to specify the amount of time that pool threads should be kept running when idle; if not specified, threads will run until the executor is shut down.
grpc.thread-pool.keepalive-time.time=The time
grpc.thread-pool.keepalive-time.unit=The time unit
grpc.thread-pool.largest-thread-count=The largest number of threads that have ever simultaneously been in the pool.
grpc.thread-pool.max-threads=The maximum thread pool size.
grpc.thread-pool.queue-size=The queue size.
grpc.thread-pool.rejected-count=The number of tasks that have been rejected.
grpc.thread-pool.task-count=The approximate total number of tasks that have ever been scheduled for execution.
grpc.thread-pool.thread-factory=Specifies the name of a specific thread factory to use to create worker threads.

# Thread pool attributes (using common prefix for standard thread pool attributes)
threadpool.common.active-count=The approximate number of threads that are actively executing tasks.
threadpool.common.completed-task-count=The approximate total number of tasks that have completed execution.
threadpool.common.current-thread-count=The current number of threads in the pool.
threadpool.common.keepalive-time=Used to specify the amount of time that pool threads should be kept running when idle; if not specified, threads will run until the executor is shut down.
threadpool.common.keepalive-time.time=The time
threadpool.common.keepalive-time.unit=The time unit
threadpool.common.largest-thread-count=The largest number of threads that have ever simultaneously been in the pool.
threadpool.common.max-threads=The maximum thread pool size.
threadpool.common.queue-size=The queue size.
threadpool.common.rejected-count=The number of tasks that have been rejected.
threadpool.common.task-count=The approximate total number of tasks that have ever been scheduled for execution.
threadpool.common.thread-factory=Specifies the name of a specific thread factory to use to create worker threads.
